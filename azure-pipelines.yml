trigger: none
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: cbnr-devops/AZDO-templates
      endpoint: cbnr-devops

parameters:
  - name: cloud
    displayName: Cloud Provider
    type: string
    default: azure
    values:
      - aws
      - azure

  - name: env
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - shared
      - staging
      - all

  - name: environments
    type: object
    default:
      - name: shared
      - name: dev
      - name: staging

variables:
  basePath: "terraform/${{ parameters.cloud }}/envs"
  TF_PLUGIN_CACHE_DIR: "$(Pipeline.Workspace)/.terraform.d/plugin-cache"

stages:
  - stage: Terraform
    displayName: Terraform Checks and Apply
    jobs:
      - job: Terraform
        displayName: Terraform Checks and Apply
        pool:
          name: "central-infra-mdp"
          demands:
            - ImageOverride -equals central-custom-linux
        workspace:
          clean: all
        steps:
          - template: templates/checkout.yml@templates

          - bash: |
              set -euo pipefail

              if command -v kubelogin >/dev/null 2>&1; then
                kubelogin --version
                exit 0
              fi

              tool_dir="$(Agent.TempDirectory)/aks-tools"
              mkdir -p "${tool_dir}"
              az aks install-cli \
                --install-location "${tool_dir}/kubectl" \
                --kubelogin-install-location "${tool_dir}/kubelogin"
              echo "##vso[task.prependpath]${tool_dir}"
            displayName: Prepare kubelogin

          - bash: mkdir -p "$TF_PLUGIN_CACHE_DIR"
            displayName: Prepare Terraform provider cache

          - script: terraform fmt -check -recursive $(basePath)
            displayName: Terraform Format Check

          - ${{ each item in parameters.environments }}:
              - template: templates/terraform-validate.yml@templates
                parameters:
                  workingDir: $(basePath)/${{ item.name }}

          # Apply one selected root, or all roots sequentially in list order.
          - ${{ each item in parameters.environments }}:
              - ${{ if or(eq(parameters.env, item.name), eq(parameters.env, 'all')) }}:
                  - template: templates/terraform-apply.yml@templates
                    parameters:
                      workingDir: $(basePath)/${{ item.name }}
