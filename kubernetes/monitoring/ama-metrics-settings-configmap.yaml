apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v2
  cluster-alias: dev-cluster

  # Keep Azure's default Kubernetes/node scraping and allow opt-in pod annotation
  # scraping for application metrics in the dev namespace.
  cluster-metrics: |-
    default-targets-metrics-keep-list = ""

    [minimal-ingestion-profile]
      enabled = true

    [pod-annotation-based-scraping]
      enabled = true
      namespaces = ["dev"]

    [default-scrape-settings-enabled]
      kubelet = true
      cadvisor = true
      kube-state-metrics = true
      nodeexporter = true
      coredns = true
      kubeproxy = false
      apiserver = false

