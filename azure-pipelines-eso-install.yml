trigger: none
pr: none

pool:
  name: central-infra-mdp
  demands:
    - ImageOverride -equals central-custom-linux

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Install and configure External Secrets Operator
    inputs:
      azureSubscription: azure-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az aks get-credentials \
          --resource-group central-dev-rg \
          --name dev-cluster \
          --overwrite-existing

        helm repo add external-secrets \
          https://charts.external-secrets.io \
          --force-update

        helm repo update external-secrets

        helm upgrade --install external-secrets \
          external-secrets/external-secrets \
          --namespace external-secrets \
          --create-namespace \
          --version 2.6.0 \
          --set installCRDs=true \
          --wait \
          --timeout 10m

        cd "$(Build.SourcesDirectory)/eso-files/azure"

        kubectl apply -f namespace-dev.yaml
        kubectl apply -f serviceaccount-dev.yaml
        kubectl apply -f secretstore-dev.yaml
        kubectl apply -f externalsecret-dev.yaml

        kubectl wait \
          --namespace dev \
          --for=condition=Ready \
          secretstore/azure-keyvault-store \
          --timeout=2m

        kubectl wait \
          --namespace dev \
          --for=condition=Ready \
          externalsecret/postgres-credentials-dev \
          --timeout=2m

        kubectl get pods --namespace external-secrets
        kubectl get secretstore --namespace dev
        kubectl get externalsecret --namespace dev
        kubectl get secret postgres-secret --namespace dev