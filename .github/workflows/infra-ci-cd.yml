name: Infra - Terraform CI/CD

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider
        required: true
        default: aws
        type: choice
        options:
          - aws
          - azure
      env:
        description: Environment to apply (dev, shared, staging, all)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - shared
          - staging
          - all

env:
  CLOUD: ${{ github.event.inputs.cloud || 'aws' }}
  BASE_PATH: terraform/${{ github.event.inputs.cloud || 'aws' }}/envs

jobs:
  pr_validation:
    name: PR title validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: cbnr-devops/GitHub-reusable-workflows/.github/actions/pr-title-validation@main

  checkout:
    runs-on: ubuntu-latest
    needs: pr_validation
    if: ${{ always() && (github.event_name != 'pull_request' || needs.pr_validation.result == 'success') }}
    steps:
      - uses: actions/checkout@v4

  terraform_format:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v4

      - name: Terraform fmt check
        shell: bash
        run: terraform fmt -check -recursive ${{ env.BASE_PATH }}

  terraform_validate:
    runs-on: ubuntu-latest
    needs: terraform_format
    strategy:
      matrix:
        env_name: [shared, dev, staging]
    steps:
      - uses: actions/checkout@v4

      - name: Terraform validate ${{ matrix.env_name }}
        uses: cbnr-devops/GitHub-reusable-workflows/.github/actions/terraform-validate@main
        with:
          working_dir: ${{ env.BASE_PATH }}/${{ matrix.env_name }}

  terraform_apply:
    runs-on: ubuntu-latest
    needs: terraform_validate
    strategy:
      matrix:
        env_name: [shared, dev, staging]

    if: >
      needs.terraform_validate.result == 'success' &&
      (${{ github.event.inputs.env }} == matrix.env_name || ${{ github.event.inputs.env }} == 'all')

    steps:
      - uses: actions/checkout@v4

      - name: Terraform apply ${{ matrix.env_name }}
        uses: cbnr-devops/GitHub-reusable-workflows/.github/actions/terraform-apply@main
        with:
          working_dir: ${{ env.BASE_PATH }}/${{ matrix.env_name }}
