apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-keyvault-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets-config
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    azure.workload.identity/client-id: {{ required "identity.clientId is required" .Values.identity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "identity.tenantId is required" .Values.identity.tenantId | quote }}
